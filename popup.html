<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>链接与磁力</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <h1>链接与磁力</h1>
    <div id="tabCount"></div>
  </header>

  <div class="section">
    <h2>电影链接打开器</h2>
    <div class="url-row">
      <label class="sr-only" for="movieUrl">电影列表 URL</label>
      <input type="text" id="movieUrl" placeholder="输入电影链接的URL">
      <button type="button" id="useCurrentTab" class="secondary-btn compact-btn">当前页</button>
    </div>
    <label for="topOption">
      <input type="checkbox" id="topOption"> TOP 模式（多页）
    </label>

    <div class="config-row">
      <label for="batchSize">
        每批数量
        <input type="number" id="batchSize" value="2" min="1" max="10">
      </label>
      <label for="delaySeconds">
        间隔秒数
        <input type="number" id="delaySeconds" value="3" min="1" max="30" step="0.5">
      </label>
      <label id="topPagesWrap" for="topPages" hidden>
        页数
        <input type="number" id="topPages" value="8" min="1" max="20">
      </label>
    </div>

    <div class="selector-config">
      <label for="sitePreset">
        网站预设
        <select id="sitePreset">
          <option value="javdb">JavDB</option>
          <option value="javbus">JavBus</option>
          <option value="javlibrary">JavLibrary</option>
          <option value="generic-list">通用列表 (a标签)</option>
          <option value="custom">自定义</option>
        </select>
      </label>
      <label class="sr-only" for="customSelector">自定义 CSS 选择器</label>
      <input type="text" id="customSelector" placeholder="自定义CSS选择器，如: .item a.link">
    </div>

    <label for="openInGroup">
      <input type="checkbox" id="openInGroup" checked> 在标签组中打开
    </label>

    <button id="openMovieLinks">打开电影链接</button>
    <div id="moviePreview" class="preview-bar is-hidden">
      <p id="moviePreviewText"></p>
      <div class="button-row">
        <button type="button" id="confirmMovieOpen">开始打开</button>
        <button type="button" id="cancelMoviePreview" class="secondary-btn">取消</button>
      </div>
    </div>
    <button id="cancelMovieTask" class="cancel-btn is-hidden">取消任务</button>
    <div id="movieProgress" class="progress-text is-empty"></div>
    <div class="progress-bar-wrap is-hidden" id="movieProgressBar">
      <div class="progress-bar-fill"></div>
    </div>
  </div>

  <div class="section collapsible" id="reloaderSection">
    <h2 class="section-header" id="refreshToggle" role="button" tabindex="0" aria-expanded="false" aria-controls="refreshContent">
      <span>标签页刷新器</span>
      <span class="toggle-icon" aria-hidden="true">▼</span>
    </h2>
    <div id="refreshContent" class="collapsible-content">
      <label class="field-label" for="refreshInterval">
        间隔（秒）
        <input type="number" id="refreshInterval" value="1" step="0.1" min="0.1">
      </label>
      <label class="checkbox-label" for="excludePinned">
        <input type="checkbox" id="excludePinned"> 排除固定标签
      </label>
      <button type="button" id="toggleRefreshing">开始刷新</button>
      <div id="refreshProgress" class="progress-text is-empty"></div>
      <div class="progress-bar-wrap is-hidden" id="refreshProgressBar">
        <div class="progress-bar-fill"></div>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>磁力链接提取器</h2>
    <p class="hint">未命中优先条件时仍取该页第一条，不会留空。</p>
    <div class="preference-row">
      <label class="checkbox-label" for="preferSubtitles">
        <input type="checkbox" id="preferSubtitles"> 优先字幕
      </label>
      <label class="checkbox-label" for="preferUncensored">
        <input type="checkbox" id="preferUncensored"> 优先无码
      </label>
    </div>
    <div class="mode-row" role="radiogroup" aria-label="提取范围">
      <label class="checkbox-label" for="extractModeFirst">
        <input type="radio" name="extractMode" id="extractModeFirst" value="first" checked>
        每页一条
      </label>
      <label class="checkbox-label" for="extractModeAll">
        <input type="radio" name="extractMode" id="extractModeAll" value="all">
        全部
      </label>
    </div>
    <button id="extractMagnetLinks">提取磁力链接</button>
    <div class="button-row is-hidden" id="magnetExportRow">
      <button id="copyMagnetLinks">复制磁力链接</button>
      <button id="exportMagnetLinks">导出 TXT</button>
      <button id="exportMagnetJson" class="secondary-btn">导出 JSON</button>
    </div>
    <div id="resultContainer" class="is-hidden"></div>
  </div>

  <div class="section collapsible">
    <h2 class="section-header" id="historyToggle" role="button" tabindex="0" aria-expanded="false" aria-controls="historyContent">
      <span>历史记录</span>
      <span class="toggle-icon" aria-hidden="true">▼</span>
    </h2>
    <div id="historyContent" class="collapsible-content">
      <button id="clearHistory" class="secondary-btn">清空历史</button>
      <div id="historyList"></div>
    </div>
  </div>

  <div class="section collapsible">
    <h2 class="section-header" id="logToggle" role="button" tabindex="0" aria-expanded="false" aria-controls="logContent">
      <span>实时日志</span>
      <span class="toggle-icon" aria-hidden="true">▼</span>
    </h2>
    <div id="logContent" class="collapsible-content">
      <button id="clearLogs" class="secondary-btn">清空日志</button>
      <div id="logContainer"></div>
    </div>
  </div>

  <footer class="popup-footer">
    <div class="theme-toggle">
      <label for="themeToggle">暗色模式</label>
      <input type="checkbox" id="themeToggle" />
    </div>
    <div id="networkStatus" class="network-status online is-hidden" role="status" aria-live="polite">
      <span class="status-dot"></span>
      <span class="status-text">网络离线</span>
    </div>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
