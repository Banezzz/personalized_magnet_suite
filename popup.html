<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超级链接与标签管理工具</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>超级链接与标签管理工具</h1>

  <div class="theme-toggle">
    <label for="themeToggle">暗色模式</label>
    <input type="checkbox" id="themeToggle" />
  </div>

  <div id="tabCount"></div>

  <div class="section">
    <h2>电影链接打开器</h2>
    <div class="url-row">
      <label class="sr-only" for="movieUrl">电影列表 URL</label>
      <input type="text" id="movieUrl" placeholder="输入电影链接的URL">
      <button type="button" id="useCurrentTab" class="secondary-btn compact-btn">当前页</button>
    </div>
    <label for="topOption">
      <input type="checkbox" id="topOption"> TOP 模式（多页）
    </label>

    <div class="config-row">
      <label for="batchSize">
        每批数量
        <input type="number" id="batchSize" value="2" min="1" max="10">
      </label>
      <label for="delaySeconds">
        间隔秒数
        <input type="number" id="delaySeconds" value="3" min="1" max="30" step="0.5">
      </label>
      <label id="topPagesWrap" for="topPages" hidden>
        页数
        <input type="number" id="topPages" value="8" min="1" max="20">
      </label>
    </div>

    <div class="selector-config">
      <label for="sitePreset">
        网站预设
        <select id="sitePreset">
          <option value="javdb">JavDB</option>
          <option value="javbus">JavBus</option>
          <option value="javlibrary">JavLibrary</option>
          <option value="generic-list">通用列表 (a标签)</option>
          <option value="custom">自定义</option>
        </select>
      </label>
      <label class="sr-only" for="customSelector">自定义 CSS 选择器</label>
      <input type="text" id="customSelector" placeholder="自定义CSS选择器，如: .item a.link">
    </div>

    <label for="openInGroup">
      <input type="checkbox" id="openInGroup" checked> 在标签组中打开
    </label>

    <button id="openMovieLinks">打开电影链接</button>
    <button id="cancelMovieTask" class="cancel-btn is-hidden">取消任务</button>
    <div id="movieProgress" class="progress-text is-empty"></div>
    <div class="progress-bar-wrap is-hidden" id="movieProgressBar">
      <div class="progress-bar-fill"></div>
    </div>
  </div>

  <div class="section">
    <h2>标签页刷新器</h2>
    <label class="sr-only" for="refreshInterval">刷新间隔（秒）</label>
    <input type="number" id="refreshInterval" value="1" step="0.1" min="0.1" placeholder="刷新间隔（秒）">
    <label class="checkbox-label" for="excludePinned">
      <input type="checkbox" id="excludePinned"> 排除固定标签
    </label>
    <button id="startRefreshing">开始刷新</button>
    <button id="stopRefreshing" disabled>停止刷新</button>
    <div id="refreshProgress" class="progress-text"></div>
    <div class="progress-bar-wrap is-hidden" id="refreshProgressBar">
      <div class="progress-bar-fill"></div>
    </div>
  </div>

  <div class="section">
    <h2>磁力链接提取器</h2>
    <button id="extractMagnetLinks">提取磁力链接（每页首选）</button>
    <button id="extractAllMagnetLinks">提取所有磁力链接</button>
    <label class="checkbox-label" for="preferSubtitles">
      <input type="checkbox" id="preferSubtitles"> 优先提取有字幕的
    </label>
    <div class="button-row">
      <button id="copyMagnetLinks">复制磁力链接</button>
      <button id="exportMagnetLinks">导出 TXT</button>
      <button id="exportMagnetJson" class="secondary-btn">导出 JSON</button>
    </div>
    <div id="resultContainer"></div>
  </div>

  <div class="section collapsible">
    <h2 class="section-header" id="historyToggle" role="button" tabindex="0" aria-expanded="false" aria-controls="historyContent">
      <span>历史记录</span>
      <span class="toggle-icon" aria-hidden="true">▼</span>
    </h2>
    <div id="historyContent" class="collapsible-content">
      <button id="clearHistory" class="secondary-btn">清空历史</button>
      <div id="historyList"></div>
    </div>
  </div>

  <div class="section collapsible">
    <h2 class="section-header" id="logToggle" role="button" tabindex="0" aria-expanded="false" aria-controls="logContent">
      <span>实时日志</span>
      <span class="toggle-icon" aria-hidden="true">▼</span>
    </h2>
    <div id="logContent" class="collapsible-content">
      <button id="clearLogs" class="secondary-btn">清空日志</button>
      <div id="logContainer"></div>
    </div>
  </div>

  <div id="networkStatus" class="network-status online" role="status" aria-live="polite">
    <span class="status-dot"></span>
    <span class="status-text">网络正常</span>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
